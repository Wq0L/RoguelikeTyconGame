<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comic Paper UI — Paket önizlemesi</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#151c29;color:#edf1f5;margin:0}header,main{padding:25px 4vw}h1{margin:0;font-size:30px}p{color:#bbc8d7;line-height:1.6}nav{position:sticky;top:0;z-index:2;display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#243147;padding:14px 4vw}select{font:inherit;padding:8px;background:#34465f;color:white;border:1px solid #6b7c95;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{padding:12px;background:#253145;border:1px solid #40516a;border-radius:6px}.stage{height:220px;display:grid;place-items:center;background-color:#283140;background-image:conic-gradient(#364254 25%,transparent 0 50%,#364254 0 75%,transparent 0);background-size:24px 24px;overflow:hidden}.stage img{max-width:100%;max-height:220px;object-fit:contain;pointer-events:none;user-select:none}.interactive{cursor:pointer}.interactive:focus{outline:2px solid #e9c56b}.light .stage{background:#f1ede5}.dark .stage{background:#0b1220}.name{font-weight:600;margin:10px 0;font-size:14px;overflow-wrap:anywhere}.links{display:flex;gap:12px;flex-wrap:wrap}a{color:#bce3f4;font-size:13px}small{display:block;margin-top:9px;color:#b6c3d4}.error{outline:2px solid #ff6262}
</style>
<header><h1>Comic Paper UI · v1</h1><p>Boş PNG sprite paketi. Parçaların üzerine gel veya basılı tut; normal / hover / pressed durumlarını karşılaştır.<br>Harfler, sayılar ve skill açıklamaları PNG’lerde yoktur. Skill bilgi panellerinin işaret ucu sağdadır.</p></header>
<nav><label>Durum <select id="state"><option value="auto">Etkileşimli</option><option value="normal">Normal</option><option value="hover">Hover</option><option value="pressed">Pressed</option></select></label><label>Zemin <select id="bg"><option value="">Damalı</option><option value="light">Açık</option><option value="dark">Koyu</option></select></label><label>Grup <select id="filter"><option value="">Hepsi</option><option>Buttons</option><option>Slots</option><option>Panels</option><option>HUD</option><option>Parts</option></select></label><a href="README.md">Kullanım notları</a><a href="manifest.json">Dosya ölçüleri</a></nav><main id="main"></main>
<script>
const interactive=["Buttons/button-green","Buttons/button-red","Buttons/button-purple","Buttons/button-gold","Slots/square-blue","Slots/square-white","Slots/square-gold","HUD/tab-blue"], statics=["Slots/grid-square-charcoal","Panels/card-portrait-cream","Panels/panel-landscape-cream","Panels/window-large-navy","Panels/sidebar-tall-navy","Panels/info-small-cream","Panels/tooltip-cream","Panels/skill-tooltip-blue-right","Panels/skill-tooltip-green-right","Panels/skill-tooltip-purple-right","Panels/skill-tooltip-gold-right","HUD/header-strip-navy","HUD/resource-counter-navy","HUD/label-strip-cream","Parts/bar-track-empty","Parts/divider-horizontal"];
const entries=[...interactive.map(path=>({path,states:true})),...statics.map(path=>({path,states:false}))];
const state=document.querySelector('#state'),bg=document.querySelector('#bg'),filter=document.querySelector('#filter'),main=document.querySelector('#main');
function render(){main.replaceChildren();for(const group of ['Buttons','Slots','Panels','HUD','Parts']){if(filter.value&&filter.value!==group)continue;const h=document.createElement('h2');h.textContent=group;main.append(h);const grid=document.createElement('div');grid.className='grid';main.append(grid);for(const e of entries.filter(e=>e.path.startsWith(group+'/'))){const name=e.path.split('/').pop(),card=document.createElement('article'),stage=document.createElement('div'),img=document.createElement('img'),meta=document.createElement('small');card.className='card';stage.className='stage'+(e.states?' interactive':'');img.alt=name;img.draggable=false;let current='normal';const src=s=>e.path+(e.states?'-'+s:'')+'.png';function set(s){current=e.states&&state.value!=='auto'?state.value:s;img.src=src(current)}img.onload=()=>{meta.textContent=img.naturalWidth+' × '+img.naturalHeight+' px · '+(e.states?current:'sabit');stage.classList.remove('error')};img.onerror=()=>{meta.textContent='Dosya bulunamadı';stage.classList.add('error')};set('normal');stage.append(img);if(e.states){stage.tabIndex=0;stage.setAttribute('role','button');stage.setAttribute('aria-label',name+' önizlemesi');stage.onpointerenter=()=>set('hover');stage.onpointerleave=()=>set('normal');stage.onpointerdown=ev=>{stage.setPointerCapture(ev.pointerId);set('pressed')};stage.onpointerup=()=>set('hover');stage.onpointercancel=()=>set('normal');stage.onfocus=()=>set('hover');stage.onblur=()=>set('normal');stage.onkeydown=ev=>{if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();set('pressed')}};stage.onkeyup=()=>set('hover');}const title=document.createElement('div');title.className='name';title.textContent=name;const links=document.createElement('div');links.className='links';for(const s of e.states?['normal','hover','pressed']:['PNG']){const a=document.createElement('a');a.href=src(s);a.textContent=s;a.download='';links.append(a)}card.append(stage,title,links,meta);grid.append(card);}}}
state.onchange=render;filter.onchange=render;bg.onchange=()=>document.body.className=bg.value;render();
</script></html>
